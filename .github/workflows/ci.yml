name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy sentinela
      - run: uv run bandit -r sentinela -ll
      - run: uv run pip-audit
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      # dependências de produção do front: nada HIGH/CRITICAL
      - run: npm audit --omit=dev --audit-level=high
      # os bundles commitados (Teia do painel e telão) têm de ser exatamente o que o script gera
      - run: bash build/construir-teia.sh
      - run: git diff --exit-code src/vendor/ src/parede/

  captura:
    # prova de zero broadcast (spec da Fase 3, §6/§9.1): núcleo + simuladores numa rede
    # isolada com tcpdump; reprova qualquer broadcast/multicast do Sentinela fora do ARP permitido
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: cena e análise da captura
        run: bash testes-rede/rodar.sh
      - name: guarda a captura e o resumo
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: captura-zero-broadcast
          path: |
            testes-rede/saida/captura.pcap
            testes-rede/saida/cena.json
            testes-rede/saida/arp_permitido.txt
            testes-rede/saida/unicast_permitido.txt
            testes-rede/saida/core.log
          if-no-files-found: ignore
          retention-days: 14

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: build das imagens
        run: |
          docker build -t sentinela-core:ci core
          docker build -t sentinela-web:ci web
      - name: imagem do core sem testes nem segredos, usuário 10001
        run: |
          test "$(docker run --rm --entrypoint id sentinela-core:ci -u)" = 10001
          # como root: o uid 10001 não lê alguns diretórios e o find sairia com 1 (quebra o bash -e)
          achados="$(docker run --rm --user 0 --entrypoint sh sentinela-core:ci -c '
            find / -xdev \( -name .env -o -name .git -o -path /app/tests -o -path /src/tests \
              -o -path "*/site-packages/sentinela/tests" -o -name conftest.py \) -print 2>/dev/null || true')"
          if [ -n "$achados" ]; then echo "$achados"; exit 1; fi
          echo ok
      - name: front sem sourcemap
        run: |
          mapas="$(docker run --rm --entrypoint find sentinela-web:ci /usr/share/nginx/html -name '*.map')"
          if [ -n "$mapas" ]; then echo "$mapas"; exit 1; fi
      - name: trivy (core)
        # SHA da tag v0.36.0: tag de action pode ser movida, commit não
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: sentinela-core:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: trivy (web)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: sentinela-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  operacao:
    # scripts de operação: testes com docker falso (todos os ramos) e a volta automática do
    # update.sh com docker de verdade, forçando uma migração que quebra a saúde do core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: shellcheck
        run: |
          shellcheck -x backup.sh restore.sh update.sh instalar.sh scripts/operacao-comum.sh \
            testes-operacao/lib.sh testes-operacao/rodar.sh testes-operacao/test_*.sh \
            testes-operacao/shims/docker testes-operacao/shims/git testes-operacao/shims/curl \n            testes-operacao/shims/uname testes-operacao/shims/ip testes-operacao/shims/systemctl testes-operacao/shims/sudo \
            testes-operacao/shims-cosign/cosign
      - name: testes com docker falso
        run: |
          for t in testes-operacao/test_*.sh; do bash "$t"; done
      - name: volta automática com docker de verdade
        env:
          CI: "true"
        run: bash testes-operacao/rodar.sh

  actionlint:
    # valida os workflows e o dependabot.yml contra o schema oficial e o actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: instala as ferramentas (versões exatas)
        run: pip install actionlint-py==1.7.12.25 check-jsonschema==0.39.0
      - name: actionlint
        run: actionlint
      - name: schema dos workflows e do dependabot
        run: |
          check-jsonschema --builtin-schema vendor.github-workflows .github/workflows/*.yml
          check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml
