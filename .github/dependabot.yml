version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/core"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      menores-e-patches:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      menores-e-patches:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      menores-e-patches:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/core"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      menores-e-patches:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      menores-e-patches:
        update-types: ["minor", "patch"]
