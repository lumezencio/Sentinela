# Regras do classificador (spec §5.2, arquitetura §8).
#
# Cada [[regra]]: quando = condições (todas precisam valer) -> pontos por classe.
# Classes válidas: as sementes (sentinela, roteador, switch, wifi, camera, gravador,
# controle_acesso, servidor, computador, impressora, iot, desconhecido).
# Vence a classe com mais pontos, com no mínimo 50 pontos absolutos; senão "desconhecido".
# Condições: fabricante_contem, porta_aberta, http_titulo_regex, origem, nome_regex,
# sinal_contem = { chave, valores }. Regex: até 200 caracteres, aplicado a textos de até 120.
# "descricao" aparece na tela como motivo; aceita {fabricante}, {titulo}, {nome}, {valor}.

# --- câmeras e gravadores -------------------------------------------------------------------

[[regra]]
id = "fabricante-video"
descricao = "Fabricante {fabricante}"
quando = { fabricante_contem = ["Hikvision", "Dahua", "Intelbras"] }
pontos = { camera = 30, gravador = 20 }

[[regra]]
id = "intelbras-controle-acesso"
descricao = "Intelbras também fabrica controle de acesso"
quando = { fabricante_contem = ["Intelbras"] }
pontos = { controle_acesso = 10 }

[[regra]]
id = "porta-rtsp"
descricao = "Porta 554 (vídeo RTSP) aberta"
quando = { porta_aberta = 554 }
pontos = { camera = 40, gravador = 25 }

[[regra]]
id = "porta-dahua"
descricao = "Porta 37777 (serviço de gravador Dahua/Intelbras) aberta"
quando = { porta_aberta = 37777 }
pontos = { gravador = 50, camera = 10 }

[[regra]]
id = "porta-sdk-hikvision"
descricao = "Porta 8000 (serviço de vídeo) aberta"
quando = { porta_aberta = 8000 }
pontos = { camera = 15, gravador = 15 }

[[regra]]
id = "origem-canal-gravador"
descricao = "Aparece como canal de um gravador"
quando = { origem = "gravador_canal" }
pontos = { camera = 60 }

[[regra]]
id = "origem-gravador"
descricao = "Cadastrado como gravador de vídeo"
quando = { origem = "gravador" }
pontos = { gravador = 60 }

[[regra]]
id = "tipo-gravador"
descricao = "O gravador informa tipo {valor}"
quando = { sinal_contem = { chave = "tipo", valores = ["nvr", "dvr", "xvr"] } }
pontos = { gravador = 40 }

[[regra]]
id = "titulo-gravador"
descricao = "Título da página: {titulo}"
quando = { http_titulo_regex = "(?i)\\b(nvr|dvr|xvr)\\b|network video recorder|digital video recorder" }
pontos = { gravador = 50 }

[[regra]]
id = "titulo-camera"
descricao = "Título da página: {titulo}"
quando = { http_titulo_regex = "(?i)\\bipc\\b|ip ?camera|network camera|webcam|c[âa]mera" }
pontos = { camera = 50 }

[[regra]]
id = "nome-camera"
descricao = "Nome parece de câmera: {nome}"
quando = { nome_regex = "(?i)\\b(cam|camera|câmera|ipc)[-_ ]?\\d*\\b" }
pontos = { camera = 30 }

[[regra]]
id = "nome-gravador"
descricao = "Nome parece de gravador: {nome}"
quando = { nome_regex = "(?i)\\b(nvr|dvr|xvr)" }
pontos = { gravador = 40 }

