# Incluído em cada location que fala com o core. Fica num arquivo à parte porque um
# proxy_set_header dentro do location anula TODOS os herdados do server.
# Host repassado como chegou (com porta): o WS confere Origin == https://{Host}.
proxy_set_header Host $http_host;
# sobrescreve (não acrescenta) o que o cliente mandou: o core confia só neste IP (uvicorn --proxy-headers)
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Forwarded "";
proxy_http_version 1.1;
proxy_redirect off;
proxy_connect_timeout 5s;
set $core http://core:8000;
proxy_pass $core;
