# nginx do Sentinela: sem privilégios (uid 101), raiz somente leitura, temporários em /tmp.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # log JSON sem corpo, cookie nem cabeçalho de autenticação
    log_format json escape=json '{"ts":"$time_iso8601","ip":"$remote_addr","metodo":"$request_method",'
                                '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
                                '"ms":"$request_time","ua":"$http_user_agent"}';
    access_log /dev/stdout json;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    # sem application/json: respostas da API levam dado + token CSRF (cautela BREACH)
    gzip_types text/css application/javascript text/javascript image/svg+xml;

    # 10 req/s por IP no login (o core ainda tem bloqueio progressivo por login e IP)
    limit_req_zone $binary_remote_addr zone=login:1m rate=10r/s;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # DNS do Docker: o core pode reiniciar sem derrubar o nginx
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTP: só saúde local e redirecionamento para HTTPS
    server {
        listen 8080 default_server;
        server_name _;

        location = /saude-web {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        include /tmp/redirecionar.conf;
    }

    server {
        listen 8443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate /certs/servidor.crt;
        ssl_certificate_key /certs/servidor.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:TLS:1m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # cabeçalhos do §13 (nenhum location abaixo usa add_header, então todos herdam)
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss:; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        root /usr/share/nginx/html;
        index index.html;

        # arquivos ocultos (.git, .env...) nunca
        location ~ /\. {
            return 404;
        }

        location = /api/v1/auth/login {
            limit_req zone=login burst=10 nodelay;
            include /etc/nginx/proxy-core.conf;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        # importação: CSV de até 1 MB + cabeçalhos do multipart. O teto aqui fica acima do
        # core (1 MB + 64 KiB), que responde 413 em JSON com mensagem em português;
        # o resto da API continua com 1m
        location = /api/v1/equipamentos/importar {
            client_max_body_size 1100k;
            include /etc/nginx/proxy-core.conf;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        location /api/ {
            include /etc/nginx/proxy-core.conf;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        location = /ws {
            include /etc/nginx/proxy-core.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # estático: só o que existe; nada de /docs, /openapi.json etc. (404)
        location / {
            expires epoch;
            try_files $uri $uri/ =404;
        }
    }
}
