# Igual ao proxy-core.conf, para o telão servido pela porta HTTP (8080 no container): o core
# recebe X-Forwarded-Proto http REAL e por isso trata a requisição como "sem cifra" (só
# responde com a chave "permitir telão sem HTTPS" ligada; o WS confere Origin http://{Host}).
proxy_set_header Host $http_host;
# sobrescreve (não acrescenta) o que o cliente mandou: o core confia só neste IP (uvicorn --proxy-headers)
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto http;
proxy_set_header Forwarded "";
proxy_http_version 1.1;
proxy_redirect off;
proxy_connect_timeout 5s;
set $core http://core:8000;
proxy_pass $core;
